name: Prepare v2 verification
on:
  push:
    branches: [refactor/pdf-workflow-v2]
    paths: [.github/workflows/bootstrap-review.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          mkdir -p /tmp/tare-v2-deps
          cd /tmp/tare-v2-deps
          npm init -y
          npm install --save-exact pdf-lib@1.17.1 electron@44.4.3 electron-builder@26.16.1 playwright@1.57.0
          node node_modules/electron/install.js
      - name: Prepare source and dependency snapshot (no fonts or user data)
        run: |
          mkdir -p /tmp/tare-v2-snapshot
          git archive HEAD src README.md BUILD_GUIDE.md package.json package-lock.json assets .gitignore > /tmp/tare-v2-snapshot/source.tar
          cp /tmp/tare-v2-deps/package-lock.json /tmp/tare-v2-snapshot/dependency-lock.json
          tar -czf /tmp/tare-v2-snapshot/dependencies.tar.gz -C /tmp/tare-v2-deps node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: tare-v2-verification-inputs
          path: /tmp/tare-v2-snapshot
          retention-days: 1
