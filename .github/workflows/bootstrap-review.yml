name: Finalize v2 dependency lock
on:
  push:
    branches: [refactor/pdf-workflow-v2]
    paths: [package.json, .github/workflows/bootstrap-review.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pdf-workflow-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lock for the pinned v2 manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lock only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock v2 dependencies for reproducible installation'
            git push origin HEAD:refactor/pdf-workflow-v2
          fi
