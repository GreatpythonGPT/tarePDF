name: Verify and build tarePDF
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run check
      - run: npm test
      - name: Electron integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Electron integration tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build portable Windows application
        if: runner.os == 'Windows'
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ runner.os }}
          path: test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && success()
        with:
          name: tarePDF-Windows-portable
          path: dist/*.exe
          retention-days: 14
